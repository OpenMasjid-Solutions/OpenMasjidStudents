name: Build image

# Builds this app's Dockerfile multi-arch (amd64 + arm64) and pushes to GHCR as
#   ghcr.io/<owner>/<repo-name>:<manifest version>   (+ :latest)
# The repo is named OpenMasjidStudents, so the image is
#   ghcr.io/openmasjid-solutions/openmasjidstudents
# which is what docker-compose.yml references. The app id stays `students`
# (the Fabric contract — see docs/FABRIC_BILLING_CONTRACT.md).
#
# TWO CHANNELS (CLAUDE.md "Branching policy"):
#   main / v* tags  ->  :<manifest version>  +  :latest              the stable channel masajid install
#   dev             ->  :<manifest version>  +  :dev  +  :dev-<sha>  the development channel
#
# Both channels publish :<manifest version>, and on dev that tag is the one the catalog pins. It is safe
# only because of the invariant the guard below enforces: on `dev` the manifest version is ALWAYS a
# `-dev.N` prerelease, so it can never collide with a released stable tag. If someone bumps dev's
# manifest to a plain `0.46.0`, this workflow refuses rather than overwriting the tag that release will
# need.
#
# :latest stays main-only. `:dev` remains as a convenience alias for `docker pull`, but nothing pins it:
# a moving tag is what broke development-channel updates in the first place — the catalog declared the
# same version as stable and pointed at a tag that silently moved, so the platform had nothing
# observable to compare and nothing to update to.
#
# After the first run, make the GHCR package Public (owner -> Packages -> package
# settings) so masjid hosts can pull it without authentication.

on:
  push:
    branches: [main, dev]
    tags: ['v*']
    # Changes that don't affect the image — skip the (slow) multi-arch build.
    # docker-compose.yml is NOT part of the image build context (.dockerignore
    # excludes *.md/docs; compose is only read by installers), so pinning the
    # image @sha256 digest in compose must not trigger a rebuild that would move
    # the tag off the pinned digest.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'screenshots/**'
      - 'LICENSE'
      - 'docker-compose.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# :dev is a MOVING tag, so two overlapping dev builds race to own it — and the loser is whichever
# finishes last, not whichever is newer. A slow arm64 build of an older commit could therefore repoint
# :dev backwards. Superseded dev builds are cancelled to make the tag follow the branch tip.
#
# Cancellation is scoped to dev deliberately: a release build must never be cancelled. (Tag pushes are
# each their own ref anyway, so they could not cancel one another regardless.)
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}

# EVERY action below is pinned to a full commit SHA, not a tag. A tag is mutable: whoever controls the
# action's repository can repoint `v4` at any commit, and every step in this job runs with
# `packages: write` and a GHCR-scoped GITHUB_TOKEN. This workflow is the only thing that publishes the
# image masajid install, so a moved tag here does not leak data — it ships a backdoored container under
# a released version number. The trailing comment records the version each SHA was resolved from;
# update both together when bumping (same pattern as cla.yml).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve image name, version, and channel tags
        id: meta
        run: |
          ver=$(grep -E '^version:' manifest.yaml | head -1 | sed -E 's/^version:[[:space:]]*//' | tr -d "\"' \r")
          [ -n "$ver" ] || ver=latest
          owner=${GITHUB_REPOSITORY_OWNER,,}
          name=$(echo "${GITHUB_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')
          img="ghcr.io/$owner/$name"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF" = refs/heads/dev ]; then
            channel=dev
            # :$ver is the immutable, versioned prerelease tag the catalog pins — the whole point of the
            # dev channel working at all. :dev is a convenience alias for a human running docker pull,
            # and :dev-<sha> ties a build to its commit.
            tags="$img:$ver
          $img:dev
          $img:dev-${GITHUB_SHA:0:7}"
          else
            channel=stable
            tags="$img:$ver
          $img:latest"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<TAGS_EOF"
            echo "$tags"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "channel=$channel"; echo "$tags"

      # docker-compose.yml is what the catalog serves to installers (it fetches the file from the ref
      # its registry entry pins), so this file IS a shipped artifact and the channel invariant belongs
      # right here, before anything is published.
      #
      # On dev, THREE things must hold or development-channel updates break silently again:
      #   1. the manifest version is a `-dev.N` prerelease — never a plain X.Y.Z, which would collide
      #      with the stable tag that release will need, and would also read as "already released";
      #   2. the compose names that exact version — the catalog embeds this compose, so a stale tag here
      #      means every dev host installs the PREVIOUS build while the catalog claims the new version;
      #   3. it is not the moving `:dev` alias — a tag that silently moves is what left the platform with
      #      nothing observable to compare, and therefore nothing to notify anyone about.
      # A v* tag must be digest-pinned: pinning a tag alone is not enough, since a tag can be repointed at
      # different content, which is why another app was delisted from the catalog on 2026-08-01. A push to
      # main may be unpinned for exactly one commit, because §19 pins the digest only AFTER the image has
      # been built from main, so that case warns.
      - name: Check the compose image matches the channel
        run: |
          ver='${{ steps.meta.outputs.version }}'
          img=$(grep -E '^[[:space:]]*image:' docker-compose.yml | head -1 | sed -E 's/^[[:space:]]*image:[[:space:]]*//')
          echo "manifest version: $ver"
          echo "compose image:    $img"

          # Every service must be pinned, not just the first: the catalog runs the whole file.
          services=$(grep -cE '^[[:space:]]*image:' docker-compose.yml)
          echo "services with an image: $services"
          if [ "$(grep -E '^[[:space:]]*image:' docker-compose.yml | grep -cE ':dev$|:latest$')" != 0 ] \
             && [ "$GITHUB_REF" != refs/heads/dev ]; then
            echo "::error::a service references a moving tag (:dev or :latest)"; exit 1
          fi

          case "$GITHUB_REF" in
            refs/heads/dev)
              case "$ver" in
                *-dev.[0-9]*) echo "ok — prerelease version" ;;
                *) echo "::error::dev's manifest version must be a prerelease like 0.46.0-dev.1, got '$ver'. A plain X.Y.Z would collide with the stable tag for that release."; exit 1 ;;
              esac
              case "$img" in
                *:dev) echo "::error::the dev compose must name the versioned tag, not the moving :dev alias — the catalog pins what is here"; exit 1 ;;
                *:"$ver") echo "ok — compose pins the exact prerelease tag" ;;
                *@sha256:*) echo "ok — compose is digest-pinned" ;;
                *) echo "::error::the dev compose must reference :$ver (or a digest), got '$img'. Bump the compose with the version."; exit 1 ;;
              esac
              # Every image line must carry the same version, so a second service cannot lag behind.
              bad=$(grep -E '^[[:space:]]*image:' docker-compose.yml | grep -vcE ":${ver}\$|@sha256:") || true
              [ "$bad" = 0 ] && echo "ok — all $services service image(s) pinned to $ver" \
                || { echo "::error::$bad service image(s) are not pinned to $ver"; exit 1; } ;;
            refs/tags/v*)
              case "$ver" in
                *-*) echo "::error::a release must not carry a prerelease version, got '$ver'"; exit 1 ;;
              esac
              case "$img" in
                *@sha256:*) echo "ok — release is digest-pinned" ;;
                *) echo "::error::a release compose must digest-pin the image (@sha256:…), got '$img'. Did a dev merge land without re-pinning?"; exit 1 ;;
              esac ;;
            refs/heads/main)
              case "$img" in
                *@sha256:*) echo "ok — main is digest-pinned" ;;
                *) echo "::warning::main's compose is not digest-pinned yet — pin the digest before tagging (CLAUDE.md §19 step 4)" ;;
              esac ;;
          esac

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags come from the channel resolved above: version + :latest on main / v* tags, the moving
      # :dev + :dev-<sha> on dev. Bump manifest.yaml `version:` for each meaningful release so a pinned
      # install stays stable (the catalog pins a git tag + version — CLAUDE.md §19).
      #
      # Multi-arch is not optional: masajid run this on Raspberry Pis (arm64) as well as amd64 hosts,
      # and the dev channel is where a Pi-only regression would be caught, so dev builds both too.
      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: What was published
        run: |
          echo "channel: ${{ steps.meta.outputs.channel }}"
          echo "digest:  ${{ steps.build.outputs.digest }}"
          if [ "${{ steps.meta.outputs.channel }}" = stable ]; then
            echo "Pin this in docker-compose.yml image line -> @${{ steps.build.outputs.digest }}"
          else
            echo "The moving :dev tag now points here. Nothing to pin — the dev channel tracks the tag."
          fi

      # ── Tell the catalog an image exists ───────────────────────────────────────────────────────────
      # Publishing an image reaches nobody on its own. OpenMasjidOS reads versions from the catalog, and
      # the catalog is only regenerated when something asks it to — so until this step existed, a dev
      # build sat in GHCR while `dev/catalog.json` still advertised the previous version and every masjid
      # was correctly told it was up to date. OpenMasjidAPPS listens for `repository_dispatch`
      # (`types: [rebuild-catalog]`) and, across its whole history, had received exactly ZERO of them:
      # every rebuild came from a push, the hourly cron, or a human. This step is the missing signal.
      #
      # It runs LAST, after the image is pushed, and that order is the point: the catalog reads
      # `manifest.yaml` from the git ref, so asking it to rebuild before the image exists publishes an
      # entry pointing at a tag nobody can pull.
      #
      # Fires on BOTH publishing paths — a `v*` release tag and a `dev` branch push. NOT on a plain push
      # to `main`: the stable catalog entry pins the release TAG, which does not exist yet at that point,
      # so a rebuild then would only re-publish the previous release.
      #
      # `continue-on-error` is deliberate. The image is already published and immutable by the time this
      # runs; a failed dispatch must not turn a good build red. The hourly cron in OpenMasjidAPPS remains
      # the floor under this — this step only removes the wait.
      #
      # Copied from OpenMasjidKiosk's build-image.yml so all app repos signal identically.
      - name: Notify catalog to rebuild
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/dev'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CATALOG_PUSH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "CATALOG_PUSH_TOKEN not set — skipping catalog dispatch (add it as an org/repo secret to auto-publish)."
            exit 0
          fi
          gh api repos/OpenMasjid-Solutions/OpenMasjidAPPS/dispatches -f event_type=rebuild-catalog
          echo "Requested an OpenMasjidAPPS catalog rebuild."
