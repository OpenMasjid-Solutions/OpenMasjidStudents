id: students
name: OpenMasjid Students
tagline: Tuition & fees for your madrasa — pay online, at the kiosk, or on the donation site
category: admin
version: 0.48.0-dev.31
author: OpenMasjid-Solutions
license: AGPL-3.0-only
icon: icon.svg
description: |
  **OpenMasjid Students** is tuition & fee management built for madāris, running on the
  masjid's own hardware.

  The office adds **students** (each with an auto-generated **Student ID**), assigns **fee
  plans** per student, and generates **one invoice per child** each month or term. A
  **finance manager** records cash / Zelle / check payments against the child they were
  paid for and sees the whole ledger; **parents** get a phone-first portal showing what
  each child owes and one combined balance they can **pay by card in the app (Stripe)** —
  with **autopay** and saved cards. Printable statements carry each child's Student ID and
  a portal-signup QR.

  Tuition can also be paid with a **child's Student ID** on the masjid's **OpenMasjid
  Donations** site and **OpenMasjid Kiosk**: type the ID, check the name it shows, then pay
  for any of your children from that one screen. Those payments flow straight into the same
  ledger over the OpenMasjidOS Fabric. Families can **pay ahead** — a term or a year at a
  time, even with nothing due — and the credit comes off their next invoice automatically.

  Works fully on the masjid network on its own; parent and finance access can also go over
  the OpenMasjidOS internet uplink. (Admin stays on the masjid network by design.)
# ── Fabric capability flags ──────────────────────────────────────────────────
sso: true                # platform admin opens it signed-in on the LAN
notifications: true      # payment / autopay / admissions alerts to the masjid webhook
stripe: true             # keys via GET /api/fabric/stripe — used for real charges (§13)
https: true              # REQUIRED: the parent portal embeds Stripe Elements (secure context)
tunnel: true             # request a public HTTPS uplink for parents + finance
# Learn our own public address at runtime (GET /api/fabric/site). OPENMASJID_PUBLIC_URL is only a
# mirror the platform writes at install, and it is EMPTY until an admin turns on Remote access — so
# without this an invite or password-reset link has no absolute URL and cannot be emailed at all.
domain: true
# Send transactional mail through the masjid's OpenMasjidOS provider (POST /api/fabric/email). This
# makes our own SMTP settings OPTIONAL rather than the only way to reach a parent; the OS owns the
# credentials and the From address. Local SMTP is still tried first so a standalone install works.
email: true
# Admin alerts (POST /api/fabric/alert). Declaring an id here IS the authorization, and the admin
# picks email / webhook / off per alert in OpenMasjidOS → Settings → Alerts. These are the events
# where a dropped webhook actually costs money or hides an attack — routine payments stay on
# `notifications` so a busy invoice day can't flood the alert channel.
alerts:
  - id: autopay-disabled
    label: Autopay switched off after repeated failures
    description: A family's card failed three times, so autopay was turned off. They will not be charged again until someone follows up.
  - id: lookup-lockout
    label: Tuition Student ID lookup locked
    description: One student's ID was locked after repeated failed attempts at the kiosk, the donation site, or parent sign-up — possibly someone guessing IDs.
  - id: reconcile-recovered
    label: A payment was recovered by reconciliation
    description: A card payment reached Stripe but never reached the ledger directly; the daily reconciliation found and recorded it. Worth a look.
  # Declared in 0.44.0. The code has raised this since 0.43.0, where it was added to the alert union but
  # NOT here — so every one of them was answered 400 "Unknown alert" and dropped, which is exactly the
  # silent-failure mode the comment above warns about. (The app's own alert emails never depended on
  # this list, which is part of why they exist.)
  - id: payment-short
    label: A payment was only partly recorded
    description: A card payment covering several children was recorded for some of them but not all. The difference has to be entered by hand — check the family's record.
  # Declared in the same release as the code that raises it (0.48.0) — see the payment-short note above
  # for what happens when those two come apart.
  - id: past-due
    label: Families are past due
    description: One or more households have a tuition bill whose due date has passed. Open the app to see who, and how much.
  - id: test
    label: Test message
    description: A test you trigger from Settings to confirm OpenMasjidOS is reaching you by email or webhook.
fabric:                  # app-to-app broker: we PROVIDE students/billing (Donations/Kiosk consume it)
  provides:
    - capability: billing
# No install-time `settings:` on purpose — installation is one-click. Everything a
# masjid needs (school name, currency, which OpenMasjidOS Stripe account to charge)
# is collected INSIDE the app: the first-run setup and the in-app admin settings,
# persisted to /data. (Same pattern as OpenMasjid Donations. Org rule: the platform
# injects no masjid profile; each app owns its own config — CLAUDE.md §2/§6.)
ports:
  - container: 8080
    label: Web interface
